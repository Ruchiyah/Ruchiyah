name: Profile visuals (3D calendar + snake)

on:
  schedule:
    - cron: "0 18 * * *" # daily, 23:30 Sri Lanka time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-visuals.yml"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-snake/snake-dark.svg?palette=github-dark&color_snake=#22c55e&color_dots=#161b22,#134e4a,#0f766e,#14b8a6,#5eead4
            profile-snake/snake-light.svg?palette=github-light&color_snake=#0f766e&color_dots=#ebedf0,#99f6e4,#2dd4bf,#0d9488,#115e59

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib profile-snake
          if git commit -m "chore: refresh profile visuals"; then
            git pull --rebase
            git push
          fi
