-anchor="middle" >1</text><rect x="463.4" y="54.0" width="73" height="30" rx="9" fill="#0b1220" fill-opacity=".85" stroke="#f43f5e" stroke-opacity=".5"/><text x="500.0" y="74.0" fill="#f1f5f9" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" >Problem</text><circle cx="680.3" cy="155.6" r="17" fill="#0b1220" stroke="#14b8a6" stroke-width="2.5"/><circle cx="680.3" cy="155.6" r="17" fill="#14b8a6" opacity=".2"><animate attributeName="opacity" values=".2;1;.2;.2" keyTimes="0;.04;.16;1" dur="12.0s" begin="1.50s" repeatCount="indefinite"/></circle><text x="680.3" y="160.6" fill="#fff" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="13" font-weight="800" text-anchor="middle" >2</text><rect x="704.3" y="140.6" width="187" height="30" rx="9" fill="#0b1220" fill-opacity=".85" stroke="#14b8a6" stroke-opacity=".5"/><text x="714.3" y="160.6" fill="#f1f5f9" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" >Understand the context</text><circle cx="755.0" cy="290.0" r="17" fill="#0b1220" stroke="#0ea5e9" stroke-width="2.5"/><circle cx="755.0" cy="290.0" r="17" fill="#0ea5e9" opacity=".2"><animate attributeName="opacity" values=".2;1;.2;.2" keyTimes="0;.04;.16;1" dur="12.0s" begin="3.00s" repeatCount="indefinite"/></circle><text x="755.0" y="295.0" fill="#fff" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="13" font-weight="800" text-anchor="middle" >3</text><rect x="779.0" y="275.0" width="187" height="30" rx="9" fill="#0b1220" fill-opacity=".85" stroke="#0ea5e9" stroke-opacity=".5"/><text x="789.0" y="295.0" fill="#f1f5f9" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" >Collect / prepare data</text><circle cx="680.3" cy="424.4" r="17" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/><circle cx="680.3" cy="42