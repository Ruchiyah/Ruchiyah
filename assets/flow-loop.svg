 stroke-opacity=".5"/><text x="285.7" y="429.4" fill="#f1f5f9" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end" >Build the solution</text><circle cx="245.0" cy="290.0" r="17" fill="#0b1220" stroke="#f59e0b" stroke-width="2.5"/><circle cx="245.0" cy="290.0" r="17" fill="#f59e0b" opacity=".2"><animate attributeName="opacity" values=".2;1;.2;.2" keyTimes="0;.04;.16;1" dur="12.0s" begin="9.00s" repeatCount="indefinite"/></circle><text x="245.0" y="295.0" fill="#fff" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="13" font-weight="800" text-anchor="middle" >7</text><rect x="49.0" y="275.0" width="172" height="30" rx="9" fill="#0b1220" fill-opacity=".85" stroke="#f59e0b" stroke-opacity=".5"/><text x="211.0" y="295.0" fill="#f1f5f9" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end" >Explain the evidence</text><circle cx="319.7" cy="155.6" r="17" fill="#0b1220" stroke="#22c55e" stroke-width="2.5"/><circle cx="319.7" cy="155.6" r="17" fill="#22c55e" opacity=".2"><animate attributeName="opacity" values=".2;1;.2;.2" keyTimes="0;.04;.16;1" dur="12.0s" begin="10.50s" repeatCount="indefinite"/></circle><text x="319.7" y="160.6" fill="#fff" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="13" font-weight="800" text-anchor="middle" >8</text><rect x="93.3" y="140.6" width="202" height="30" rx="9" fill="#0b1220" fill-opacity=".85" stroke="#22c55e" stroke-opacity=".5"/><text x="285.7" y="160.6" fill="#f1f5f9" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="end" >Improve the next version</text><circle r="8" fill="#ffffff" filter="url(#glow)"><animateMotion dur="12.0s" repeatCount="indefinite" path="M500,100 A255,190 0 1,1 500,480 A255,190 0 1,1 500,100"/></circle>
