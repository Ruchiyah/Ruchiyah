<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="LibraAI — Agentic Library Desk — An agentic AI system that runs the library desk: answers catalog questions with hybrid retrieval, a safety policy, PII masking and audit logs.">
