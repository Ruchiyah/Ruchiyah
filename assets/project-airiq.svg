<text x="32" y="50" fill="#5dd0e3" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="2">MACHINE LEARNING · TIME-SERIES FORECASTING</text>
