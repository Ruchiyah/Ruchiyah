<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="AirIQ — Air Quality Forecasting — Next-hour PM2.5 forecasts for 12 Beijing stations, trained on 420K hourly records with walk-forward validation. Final hold-out R² 0.912.">
