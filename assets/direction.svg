<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Long-term direction: grow into a Data Scientist / AI-focused technologist">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030712"/><stop offset="1" stop-color="#06201f"/></linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#5eead4"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".65" stop-color="#22c55e"/><stop offset="1" stop-color="#5eead4"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  .bob{animation:bob 4.5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  .run{stroke-dasharray:90 2400;animation:run 7s linear infinite}
  @keyframes run{to{stroke-dashoffset:-2490}}
  .flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
</style>
<rect width="1000" height="300" rx="24" fill="url(#bg)"/><rect x=".75" y=".75" width="998.5" height="298.5" rx="24" fill="none" stroke="#14b8a6" stroke-opacity=".3" stroke-width="1.5"/><ellipse cx="170" cy="160" rx="120" ry="54" fill="#0f766e" fill-opacity=".18" stroke="#0f766e" stroke-width="2"/><ellipse cx="170" cy="160" rx="92" ry="41" fill="#0ea5e9" fill-opacity=".18" stroke="#0ea5e9" stroke-width="2"/><ellipse cx="170" cy="160" rx="64" ry="29" fill="#8b5cf6" fill-opacity=".18" stroke="#8b5cf6" stroke-width="2"/><ellipse cx="170" cy="160" rx="36" ry="16" fill="#22c55e" fill-opacity=".18" stroke="#22c55e" stroke-width="2"/><ellipse cx="170" cy="160" rx="10" ry="5" fill="none" stroke="#5eead4" stroke-width="2"><animate attributeName="rx" values="10;130" dur="2.6s" repeatCount="indefinite"/><animate attributeName="ry" values="5;58" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.6s" repeatCount="indefinite"/></ellipse><g><line x1="170" y1="160" x2="240" y2="50" stroke="#f8fafc" stroke-width="3"/><polygon points="240,50 252,42 244,62" fill="#f43f5e"/><circle cx="170" cy="160" r="6" fill="#f43f5e" filter="url(#glow)"/><animateTransform attributeName="transform" type="translate" values="40 -40;0 0;0 0;0 -4;0 0" keyTimes="0;.15;.6;.65;1" dur="5s" repeatCount="indefinite"/></g><text x="340" y="60" fill="#5eead4" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="3">LONG_TERM_DIRECTION</text><text x="340" y="104" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="800" fill="#f8fafc">Data Scientist <tspan fill="#64748b">/</tspan> <tspan fill="url(#shine)">AI-focused technologist</tspan></text><text x="340" y="140" fill="#94a3b8" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" >Moving comfortably from raw data and statistical reasoning</text><text x="340" y="163" fill="#94a3b8" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" >to machine learning, software and useful real-world systems.</text><rect x="340" y="186" width="86" height="30" rx="15" fill="#0b1220" stroke="#14b8a6" stroke-opacity=".6"/><rect x="340" y="186" width="86" height="30" rx="15" fill="#14b8a6" opacity="0"><animate attributeName="opacity" values="0;.4;0;0" keyTimes="0;.06;.2;1" dur="6s" begin="0.0s" repeatCount="indefinite"/></rect><text x="383.2" y="206" fill="#ccfbf1" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" >Raw data</text><text x="438.4" y="207" fill="#475569" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" >→</text><rect x="450" y="186" width="188" height="30" rx="15" fill="#0b1220" stroke="#14b8a6" stroke-opacity=".6"/><rect x="450" y="186" width="188" height="30" rx="15" fill="#14b8a6" opacity="0"><animate attributeName="opacity" values="0;.4;0;0" keyTimes="0;.06;.2;1" dur="6s" begin="1.1s" repeatCount="indefinite"/></rect><text x="544.3" y="206" fill="#ccfbf1" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" >Statistical reasoning</text><text x="650.1999999999999" y="207" fill="#475569" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" >→</text><rect x="662" y="186" width="149" height="30" rx="15" fill="#0b1220" stroke="#14b8a6" stroke-opacity=".6"/><rect x="662" y="186" width="149" height="30" rx="15" fill="#14b8a6" opacity="0"><animate attributeName="opacity" values="0;.4;0;0" keyTimes="0;.06;.2;1" dur="6s" begin="2.2s" repeatCount="indefinite"/></rect><text x="736.5999999999999" y="206" fill="#ccfbf1" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" >Machine learning</text><text x="823.0" y="207" fill="#475569" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" >→</text><rect x="340" y="230" width="180" height="30" rx="15" fill="#0b1220" stroke="#14b8a6" stroke-opacity=".6"/><rect x="340" y="230" width="180" height="30" rx="15" fill="#14b8a6" opacity="0"><animate attributeName="opacity" values="0;.4;0;0" keyTimes="0;.06;.2;1" dur="6s" begin="3.3s" repeatCount="indefinite"/></rect><text x="430.0" y="250" fill="#ccfbf1" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" >Software engineering</text><text x="532.0" y="251" fill="#475569" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" >→</text><rect x="544" y="230" width="164" height="30" rx="15" fill="#0b1220" stroke="#14b8a6" stroke-opacity=".6"/><rect x="544" y="230" width="164" height="30" rx="15" fill="#14b8a6" opacity="0"><animate attributeName="opacity" values="0;.4;0;0" keyTimes="0;.06;.2;1" dur="6s" begin="4.4s" repeatCount="indefinite"/></rect><text x="626.2" y="250" fill="#ccfbf1" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" >Real-world systems</text>
</svg>
