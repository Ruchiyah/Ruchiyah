mily="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="30" font-weight="800" text-anchor="middle" >?</text></g><text x="120" y="228" fill="#f8fafc" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.5">CURIOSITY</text><text x="120" y="256" fill="#7ed8ce" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" text-anchor="middle" >ask better questions</text><polygon points="366.0,78.0 416.2,107.0 416.2,165.0 366.0,194.0 315.8,165.0 315.8,107.0" fill="#043246" opacity=".8"/><g class="bob" style="animation-delay:-0.6s"><polygon points="360.0,70.0 410.2,99.0 410.2,157.0 360.0,186.0 309.8,157.0 309.8,99.0" fill="#0b1220" stroke="#0ea5e9" stroke-width="2.5"/><polygon points="360.0,80.0 401.6,104.0 401.6,152.0 360.0,176.0 318.4,152.0 318.4,104.0" fill="#0ea5e9" fill-opacity=".14"/><text x="360" y="139" fill="#93d6f5" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="30" font-weight="800" text-anchor="middle" >Σ</text></g><text x="360" y="228" fill="#f8fafc" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.5">EVIDENCE</text><text x="360" y="256" fill="#7acef3" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" text-anchor="middle" >don&#x27;t trust</text><text x="360" y="277" fill="#7acef3" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" text-anchor="middle" >assumptions blindly</text><polygon points="606.0,78.0 656.2,107.0 656.2,165.0 606.0,194.0 555.8,165.0 555.8,107.0" fill="#2a1c4a" opacity=".8"/><g class="bob" style="animation-delay:-1.2s"><polygon points="600.0,70.0 650.2,99.0 650.2,157.0 600.0,186.0 549.8,157.0 549.8,99.0" fill="#0b1220" stroke="#8b5cf6" stroke-width="2.5"/><polygon points="600.0,80.0 6